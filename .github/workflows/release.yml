name: 发布 macOS 应用

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的版本标签，例如 v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: 检查并打包 Universal 应用
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 验证版本标签
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"

      - name: 检出发布源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: 验证应用版本
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "v$version" == "$RELEASE_TAG" ]] || { echo "标签与应用版本不一致"; exit 1; }
          xcodebuild -version
          swift --version

      - name: 类型检查与核心测试
        run: ./scripts/check.sh

      - name: 构建 Intel 与 Apple Silicon 应用
        run: ./scripts/package.sh --universal

      - name: 生成压缩包和校验文件
        shell: bash
        run: |
          archive="QuietWall-${RELEASE_TAG}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/QuietWall.app "dist/$archive"
          cd dist
          shasum -a 256 "$archive" > SHA256SUMS.txt

      - name: 上传到 GitHub Release
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/QuietWall-${RELEASE_TAG}-universal.zip" \
            dist/SHA256SUMS.txt --clobber
